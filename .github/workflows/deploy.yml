name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never let two deploys race; queue them instead of cancelling, so the last
# push always ends up being what is live.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Gate the deploy on the same checks CI runs: a red deploy costs more
      # to unpick than a red build.
      - run: npm run typecheck
      - run: npm run check:web
      - run: npm test

      # wrangler.jsonc serves web/dist as static assets, so the client has to
      # be built before the Worker is uploaded.
      - run: npm run build

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
